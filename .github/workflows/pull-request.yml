name: Pull request validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore app/KobareoCalendar.slnx
      - run: dotnet test app/KobareoCalendar.slnx --no-restore -m:1
      - run: dotnet build app/KobareoCalendar.slnx --no-restore -c Release -m:1
      - run: dotnet tool restore
      - run: scripts/validate-migrations.sh

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
        working-directory: app/src/KobareoCalendar.WebApp/ClientApp
      - run: npm test
        working-directory: app/src/KobareoCalendar.WebApp/ClientApp
      - run: npm run build
        working-directory: app/src/KobareoCalendar.WebApp/ClientApp

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v6.15.0
        with:
          context: app
          target: final
          push: false
          tags: kobareo-calendar/app:pr

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
      - run: terraform fmt -check -recursive infra
      - run: scripts/validate-terraform-scope.sh
      - run: scripts/validate-no-secrets.sh
      - name: Validate Terraform roots without cloud authentication
        run: |
          set -euo pipefail
          for root in infra/bootstrap/02-state infra/bootstrap/03-identity infra/bootstrap/04-domain infra/environments/production; do
            terraform -chdir="$root" init -backend=false
            terraform -chdir="$root" validate
          done
