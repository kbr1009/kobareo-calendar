name: Deploy production application

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact main commit SHA to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY-kobareo-calendar
        required: true
        type: string
      bootstrap_images_only:
        description: Push initial images without updating or executing Cloud Run workloads
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: kobareo-calendar-production
  cancel-in-progress: false

env:
  PROJECT_ID: kobareo-calendar
  REGION: asia-northeast1
  REPOSITORY: kobareo-calendar

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Verify manual approval and immutable GitHub identity
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          ACTOR_ID: ${{ github.actor_id }}
          EXPECTED_ACTOR_ID: ${{ vars.GH_ACTOR_ID }}
          OWNER_ID: ${{ github.repository_owner_id }}
          EXPECTED_OWNER_ID: ${{ vars.GH_OWNER_ID }}
          REPOSITORY_ID: ${{ github.repository_id }}
          EXPECTED_REPOSITORY_ID: ${{ vars.GH_REPOSITORY_ID }}
        run: test "$CONFIRMATION" = "DEPLOY-kobareo-calendar" && test "$ACTOR_ID" = "$EXPECTED_ACTOR_ID" && test "$OWNER_ID" = "$EXPECTED_OWNER_ID" && test "$REPOSITORY_ID" = "$EXPECTED_REPOSITORY_ID"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Require deployment commit to equal main HEAD
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_DEPLOY_PROVIDER }}
          service_account: github-deployer@kobareo-calendar.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - id: app
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v6.15.0
        with:
          context: app
          target: final
          push: true
          tags: asia-northeast1-docker.pkg.dev/kobareo-calendar/kobareo-calendar/app:${{ inputs.commit_sha }}
      - id: migration
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v6.15.0
        with:
          context: app
          target: migration
          push: true
          tags: asia-northeast1-docker.pkg.dev/kobareo-calendar/kobareo-calendar/migration:${{ inputs.commit_sha }}
      - name: Update and execute migration job
        if: ${{ !inputs.bootstrap_images_only }}
        env:
          MIGRATION_DIGEST: ${{ steps.migration.outputs.digest }}
        run: |
          gcloud run jobs update kobareo-migration --project="$PROJECT_ID" --region="$REGION" --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/migration@${MIGRATION_DIGEST}"
          gcloud run jobs execute kobareo-migration --project="$PROJECT_ID" --region="$REGION" --wait
      - name: Deploy monolith application only after migration succeeds
        if: ${{ !inputs.bootstrap_images_only }}
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
        run: |
          gcloud run services update kobareo-calendar --project="$PROJECT_ID" --region="$REGION" --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/app@${APP_DIGEST}"
      - name: Verify public health endpoint
        if: ${{ !inputs.bootstrap_images_only }}
        run: curl --fail --silent --show-error --retry 6 --retry-delay 10 https://calendar.kobareo.com/api/health
      - name: Record immutable image digests
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          MIGRATION_DIGEST: ${{ steps.migration.outputs.digest }}
        run: |
          {
            echo "### Immutable production images"
            echo "- app: ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/app@${APP_DIGEST}"
            echo "- migration: ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/migration@${MIGRATION_DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
